<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحاسبة الذكية</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        /* تصميم الآلة الحاسبة */
        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 320px;
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #fff;
            border: none;
            font-size: 2rem;
            text-align: left;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            background-color: #e0e0e0;
            cursor: pointer;
        }
        .operator { background-color: #ff9500; color: white; }
        #equal { background-color: #25d366; color: white; grid-row: span 2; }
        .zero { grid-column: span 2; }

        /* تصميم شاشة المذكرات السرية */
        .notes-container {
            display: none; /* مخفية في البداية */
            background-color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            flex-direction: column;
        }
        .notes-container h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        #notes-area {
            width: 100%;
            height: 250px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1.1rem;
            resize: none;
            margin-bottom: 15px;
        }
        .btn-save {
            background-color: #007bff;
            color: white;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-save:hover { background-color: #0056b3; }
        .btn-close {
            background-color: #dc3545;
            color: white;
            padding: 8px;
            font-size: 0.9rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- واجهة الآلة الحاسبة -->
    <div class="calculator" id="calc-screen">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button onclick="clearDisplay()" class="operator">C</button>
            <button onclick="deleteLast()" class="operator">DEL</button>
            <button onclick="appendValue('/')" class="operator">÷</button>
            <button onclick="appendValue('*')" class="operator">×</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('-')" class="operator">-</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('+')" class="operator">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculate()" id="equal">=</button>

            <button onclick="appendValue('0')" class="zero">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <!-- واجهة المذكرات السرية -->
    <div class="notes-container" id="notes-screen">
        <h2>📝 مذكراتي السرية</h2>
        <textarea id="notes-area" placeholder="اكتب مذكراتك هنا وسوف تُحفظ تلقائياً..."></textarea>
        <button onclick="saveNotes()" class="btn-save">💾 حفظ وإغلاق</button>
        <button onclick="closeNotes()" class="btn-close">خروج سريع</button>
    </div>

    <script>
        const display = document.getElementById('display');
        const calcScreen = document.getElementById('calc-screen');
        const notesScreen = document.getElementById('notes-screen');
        const notesArea = document.getElementById('notes-area');

        function appendValue(input) { display.value += input; }
        function clearDisplay() { display.value = ''; }
        function deleteLast() { display.value = display.value.slice(0, -1); }

        function calculate() {
            // التحقق إذا كتب المستخدم الرقم السري الحقيقي الخاص بك
            if (display.value === '123124') {
                openNotes();
                clearDisplay();
                return;
            }

            // الحساب الطبيعي لباقي الأرقام
            try { display.value = eval(display.value); } 
            catch (error) { display.value = 'خطأ'; }
        }

        // دالة لفتح شاشة المذكرات وجلب النص المحفوظ سابقاً
        function openNotes() {
            calcScreen.style.display = 'none';
            notesScreen.style.display = 'flex';
            // استرجاع النص من ذاكرة الهاتف الداخلية (Local Storage)
            const savedText = localStorage.getItem('secret_notes');
            if (savedText) {
                notesArea.value = savedText;
            }
        }

        // دالة لحفظ المذكرات في الهاتف وإعادة إخفائها
        function saveNotes() {
            localStorage.setItem('secret_notes', notesArea.value);
            alert('تم حفظ مذكراتك بنجاح وبأمان!');
            closeNotes();
        }

        // دالة لإغلاق شاشة المذكرات والعودة للحاسبة
        function closeNotes() {
            notesScreen.style.display = 'none';
            calcScreen.style.display = 'block';
            display.value = '';
        }
    </script>
</body>
</html>
